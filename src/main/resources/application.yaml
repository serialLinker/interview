spring:
  application:
    name: demo
  h2:
    console:
      enabled: true
  datasource:
    url: jdbc:h2:mem:java-interview;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: update
    defer-datasource-initialization: true
    database-platform: org.hibernate.dialect.H2Dialect
    open-in-view: false